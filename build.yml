version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install
  pre_build:
    commands:
      - echo "Running pre-build checks and tests..."
      - npm test
      - node app.js
  build:
    commands:
      - echo "Building Placement Demo Website..."
      - npm run build
      - ls -la
  post_build:
    commands:
      - echo "Build completed successfully on $(date)"

artifacts:
  files:
    - '**/*'
